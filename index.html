<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DentaCare">
    <meta name="theme-color" content="#0a0e1a">
    <meta name="description"
        content="Приложение для управления пациентами стоматологии — запись визитов, процедур, фотографий и стоимости">
    <title>DentaCare — Стоматологический журнал</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Main App Container -->
    <div id="app" class="app">
        <!-- Header -->
        <header id="main-header" class="header">
            <div class="header-content">
                <div class="header-left">
                    <button id="back-btn" class="header-btn hidden" onclick="goBack()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>
                    <h1 id="header-title" class="header-title">DentaCare</h1>
                </div>
                <div class="header-right">
                    <button id="search-toggle-btn" class="header-btn" onclick="toggleSearch()">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>
                </div>
            </div>
            <!-- Search Bar -->
            <div id="search-bar" class="search-bar hidden">
                <div class="search-input-wrapper">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input id="search-input" type="text" placeholder="Поиск пациента..."
                        oninput="searchPatients(this.value)">
                    <button class="search-clear" onclick="clearSearch()">✕</button>
                </div>
            </div>
        </header>

        <!-- Pages Container -->
        <main id="pages-container" class="pages-container">

            <section id="page-patients" class="page active">
                <!-- Stats Cards -->
                <div class="stats-grid">
                    <div class="stat-card stat-total">
                        <div class="stat-icon">👥</div>
                        <div class="stat-info">
                            <span class="stat-value" id="stat-total">0</span>
                            <span class="stat-label">Всего</span>
                        </div>
                    </div>
                    <div class="stat-card stat-active">
                        <div class="stat-icon">🔄</div>
                        <div class="stat-info">
                            <span class="stat-value" id="stat-active">0</span>
                            <span class="stat-label">Активные</span>
                        </div>
                    </div>
                    <div class="stat-card stat-completed">
                        <div class="stat-icon">✅</div>
                        <div class="stat-info">
                            <span class="stat-value" id="stat-completed">0</span>
                            <span class="stat-label">Завершённые</span>
                        </div>
                    </div>
                    <div class="stat-card stat-revenue">
                        <div class="stat-icon">💰</div>
                        <div class="stat-info">
                            <span class="stat-value" id="stat-revenue">0</span>
                            <span class="stat-label">Доход</span>
                        </div>
                    </div>
                </div>

                <!-- Filter Tabs -->
                <div class="filter-tabs">
                    <button class="filter-tab active" data-filter="all" onclick="filterPatients('all', this)">
                        Все
                    </button>
                    <button class="filter-tab" data-filter="active" onclick="filterPatients('active', this)">
                        Активные
                    </button>
                    <button class="filter-tab" data-filter="completed" onclick="filterPatients('completed', this)">
                        Завершённые
                    </button>
                </div>

                <!-- Patient List -->
                <div id="patients-list" class="patients-list">
                    <!-- Patients will be rendered here -->
                </div>

                <!-- Empty State -->
                <div id="empty-state" class="empty-state hidden">
                    <div class="empty-icon">🦷</div>
                    <h3>Нет пациентов</h3>
                    <p>Нажмите «+» чтобы добавить первого пациента</p>
                </div>
            </section>

            <!-- Page: Add/Edit Patient -->
            <section id="page-add-patient" class="page">
                <div class="form-container">
                    <h2 class="form-title" id="form-title">Новый пациент</h2>

                    <div class="form-group">
                        <label class="form-label">Фотография</label>
                        <div class="photo-upload" id="photo-upload-area"
                            onclick="document.getElementById('photo-input').click()">
                            <div id="photo-preview" class="photo-preview">
                                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                    <polyline points="21 15 16 10 5 21"></polyline>
                                </svg>
                                <span>Нажмите для загрузки</span>
                            </div>
                            <input type="file" id="photo-input" accept="image/*" capture="environment"
                                onchange="handlePhotoUpload(event)" style="display:none">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="patient-firstname">Имя *</label>
                            <input type="text" id="patient-firstname" class="form-input" placeholder="Введите имя"
                                required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="patient-lastname">Фамилия *</label>
                            <input type="text" id="patient-lastname" class="form-input" placeholder="Введите фамилию"
                                required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="patient-age">Возраст (лет) *</label>
                        <input type="number" id="patient-age" class="form-input" placeholder="Например, 35" min="1"
                            max="120" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="patient-phone">Телефон</label>
                        <input type="tel" id="patient-phone" class="form-input" placeholder="+992 XX XXX XX XX">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="patient-referral">Откуда пришёл</label>
                        <input type="text" id="patient-referral" class="form-input"
                            placeholder="Рекомендация, реклама, интернет...">
                    </div>

                    <div class="form-group" id="patient-visit-date-group">
                        <label class="form-label" for="patient-visit-date">Дата визита *</label>
                        <input type="date" id="patient-visit-date" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="patient-treatment-type">Тип лечения</label>
                        <select id="patient-treatment-type" class="form-input"
                            onchange="toggleCustomTreatment(this.value)">
                            <option value="">Выберите тип лечения</option>
                            <option value="karies">Лечение кариеса</option>
                            <option value="endodontics">Эндодонтия</option>
                            <option value="cleaning">Профилактическая чистка</option>
                            <option value="orthopedics">Ортопедия</option>
                            <option value="surgery">Хирургия</option>
                            <option value="custom">✏️ Свой вариант...</option>
                        </select>
                        <div id="custom-treatment-wrapper" class="custom-treatment-wrapper hidden">
                            <input type="text" id="patient-treatment-custom" class="form-input"
                                placeholder="Напишите свой тип лечения...">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Анализы</label>
                        <div class="analysis-toggle">
                            <label class="analysis-option">
                                <input type="radio" name="patient-analysis" id="analysis-healthy" value="healthy">
                                <span class="analysis-label analysis-healthy">🟢 Здоров</span>
                            </label>
                            <label class="analysis-option">
                                <input type="radio" name="patient-analysis" id="analysis-sick" value="sick">
                                <span class="analysis-label analysis-sick">🔴 Болен</span>
                            </label>
                            <label class="analysis-option">
                                <input type="radio" name="patient-analysis" id="analysis-none" value="none" checked>
                                <span class="analysis-label analysis-none">➖ Не указано</span>
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="patient-total-cost">Общая сумма (сум)</label>
                        <input type="number" id="patient-total-cost" class="form-input" placeholder="Введите общую сумму">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="patient-notes">Заметки</label>
                        <textarea id="patient-notes" class="form-input form-textarea"
                            placeholder="Аллергии, особенности..."></textarea>
                    </div>

                    <button id="save-patient-btn" class="btn btn-primary btn-block" onclick="savePatient()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                            <polyline points="17 21 17 13 7 13 7 21"></polyline>
                            <polyline points="7 3 7 8 15 8"></polyline>
                        </svg>
                        Сохранить пациента
                    </button>
                </div>
            </section>

            <!-- Page: Patient Detail -->
            <section id="page-patient-detail" class="page">
                <div id="patient-detail-content" class="patient-detail">
                    <!-- Will be rendered dynamically -->
                </div>
            </section>

            <!-- Page: Add Visit -->
            <section id="page-add-visit" class="page">
                <div class="form-container">
                    <h2 class="form-title" id="visit-form-title">Новый визит</h2>

                    <div class="form-group">
                        <label class="form-label" for="visit-date">Дата визита *</label>
                        <input type="date" id="visit-date" class="form-input" required>
                    </div>

                    <!-- Procedures List -->
                    <div class="form-group">
                        <div class="form-label-row">
                            <label class="form-label">Процедуры</label>
                            <button class="btn-add-small" onclick="addProcedureField()">+ Добавить</button>
                        </div>
                        <div id="procedures-list" class="procedures-list">
                            <!-- Procedure fields will be added here -->
                        </div>
                    </div>

                    <!-- Visit Photos -->
                    <div class="form-group">
                        <label class="form-label">Фотографии визита</label>
                        <div class="visit-photos-grid" id="visit-photos-grid">
                            <div class="visit-photo-add" onclick="document.getElementById('visit-photo-input').click()">
                                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="1.5">
                                    <line x1="12" y1="5" x2="12" y2="19"></line>
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                </svg>
                                <span>Добавить фото</span>
                            </div>
                        </div>
                        <input type="file" id="visit-photo-input" accept="image/*" capture="environment" multiple
                            onchange="handleVisitPhotos(event)" style="display:none">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="visit-notes">Заметки к визиту</label>
                        <textarea id="visit-notes" class="form-input form-textarea"
                            placeholder="Дополнительные заметки..."></textarea>
                    </div>

                    <!-- Total Cost Display -->
                    <div class="total-cost-display">
                        <span>Общая стоимость:</span>
                        <span id="total-cost-value" class="total-cost-value">0 сум</span>
                    </div>

                    <button id="save-visit-btn" class="btn btn-primary btn-block" onclick="saveVisit()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        Сохранить визит
                    </button>
                </div>
            </section>
        </main>

        <!-- FAB Button -->
        <button id="fab-btn" class="fab" onclick="navigateTo('page-add-patient')">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </button>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="navigateTo('page-patients'); setActiveNav(this)">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <span>Пациенты</span>
            </button>
            <button class="nav-item" onclick="showStats(); setActiveNav(this)">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="20" x2="18" y2="10"></line>
                    <line x1="12" y1="20" x2="12" y2="4"></line>
                    <line x1="6" y1="20" x2="6" y2="14"></line>
                </svg>
                <span>Статистика</span>
            </button>
        </nav>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">
        <span id="toast-message"></span>
    </div>

    <!-- Confirm Dialog -->
    <div id="confirm-dialog" class="dialog-overlay hidden">
        <div class="dialog">
            <h3 id="dialog-title" class="dialog-title">Подтверждение</h3>
            <p id="dialog-message" class="dialog-message"></p>
            <div class="dialog-actions">
                <button class="btn btn-secondary" onclick="closeDialog()">Отмена</button>
                <button id="dialog-confirm-btn" class="btn btn-danger">Удалить</button>
            </div>
        </div>
    </div>

    <!-- Photo Viewer -->
    <div id="photo-viewer" class="photo-viewer hidden" onclick="closePhotoViewer()">
        <button class="photo-viewer-close" onclick="closePhotoViewer()">✕</button>
        <div class="photo-viewer-content" onclick="event.stopPropagation()">
            <img id="photo-viewer-img" src="" alt="Фото">
            <a id="photo-viewer-download" class="btn btn-primary" style="margin-top: 15px; display: none;" download="photo.png">Скачать фото</a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="db.js"></script>
    <script src="app.js"></script>
</body>

</html>
